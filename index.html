<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krateon - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        
        h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            animation: fadeInUp 1s ease;
            letter-spacing: 0.1em;
        }
        
        p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            animation: fadeInUp 1s ease 0.2s both;
        }
        
        .email-form {
            animation: fadeInUp 1s ease 0.4s both;
        }
        
        input {
            padding: 1rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 1rem;
            outline: none;
        }
        
        input:focus {
            box-shadow: 0 0 0 3px rgba(255,255,255,0.3);
        }
        
        button {
            padding: 1rem 2.5rem;
            font-size: 1rem;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .social-links {
            margin-top: 3rem;
            animation: fadeInUp 1s ease 0.6s both;
        }
        
        .social-links a {
            color: white;
            text-decoration: none;
            margin: 0 1rem;
            font-size: 1.2rem;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        
        .social-links a:hover {
            opacity: 1;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            p {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>KRATEON</h1>
        <p>Something amazing is coming soon</p>
        <div class="email-form">
            <input type="email" placeholder="Enter your email for updates" id="emailInput">
            <br>
            <button onclick="notify()">Notify Me</button>
        </div>
        <div class="social-links">
            <a href="#" title="Follow us">Stay tuned for updates</a>
        </div>
    </div>
    
    <script>
        function notify() {
            const email = document.getElementById('emailInput').value;
            if(email && email.includes('@')) {
                alert('Thanks! We\'ll notify you at: ' + email);
                document.getElementById('emailInput').value = '';
            } else {
                alert('Please enter a valid email address');
            }
        }
    </script>
</body>
</html>
